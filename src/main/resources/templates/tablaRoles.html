<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vista rol - Trips El Salvador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-white">
                <img alt="logo" th:src="@{/images/logo.png}" width="130" height="130">
                <h1 class="h3 mb-0">Vista Admin</h1>
            </div>
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>estado</th>
                            <th>Fecha publicación</th>
                            <th>Detalle</th>
                            <th>Elminar</th>
                        </tr>
                    </thead>
                    <tbody>
                        
                        <tr th:each="rol : ${roles}">
                            <td th:text="${rol.id}"></td>
                            <td th:text="${rol.nombre}"></td>
                            <td th:text="${rol.descripcion}"></td>
                            <td>
                                <span th:if="${rol.estado == 1}" class="badge bg-success text-uppercase p-2">Si</span>
                                <span th:unless="${rol.estado == 1}" class="badge bg-danger text-uppercase p-2">No</span>
                            </td>
                            <td th:text="${#dates.format(rol.fecha, 'dd-MM-yyyy')}"></td>
                            <td>
                       			<a th:href="@{/roles/view/{id} (id=${rol.id}) }" class="btn btn-success" >Detalle</a>
                       		</td>
                       		<td>
    							<a th:href="@{/roles/delete(id=${rol.id}) }" class="btn btn-danger" >Eliminar</a>
							</td> 
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
